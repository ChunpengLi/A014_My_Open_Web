<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="My Open Web - a small first public website deployed with GitHub and Cloudflare Pages."
    />
    <title>My Open Web</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/styles.css" />
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <main class="page-shell" aria-labelledby="site-title">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Hello, public web</p>
          <h1 id="site-title">My Open Web</h1>
          <p class="lead">
            This is my first public website. It is intentionally simple, fast, and ready for automatic deployment.
          </p>
          <div class="actions" aria-label="Page actions">
            <a class="button primary" href="https://www.cloudflare.com/" rel="noreferrer">Cloudflare</a>
            <a class="button" href="https://github.com/" rel="noreferrer">GitHub</a>
          </div>
        </div>
        <img
          class="hero-image"
          src="assets/hero.png"
          alt="A simple website shown on a laptop"
          width="1200"
          height="720"
        />
      </section>

      <section class="tetris-panel" aria-labelledby="tetris-title">
        <div class="tetris-head">
          <div>
            <span class="label">Play</span>
            <h2 id="tetris-title">Online Tetris</h2>
          </div>
          <div class="tetris-stats" aria-label="Game stats">
            <span>Score <strong id="tetris-score">0</strong></span>
            <span>Lines <strong id="tetris-lines">0</strong></span>
            <span>Level <strong id="tetris-level">1</strong></span>
          </div>
        </div>
        <div class="tetris-stage">
          <canvas
            id="tetris-board"
            width="240"
            height="480"
            aria-label="Online Tetris game board"
          ></canvas>
          <div class="tetris-side">
            <div class="next-piece" aria-label="Next piece preview">
              <span class="label">Next</span>
              <canvas id="tetris-next" width="96" height="96"></canvas>
            </div>
            <div class="game-buttons" aria-label="Game commands">
              <button class="button primary" type="button" id="tetris-start">Start</button>
              <button class="button" type="button" id="tetris-pause">Pause</button>
              <button class="button" type="button" id="tetris-reset">Reset</button>
            </div>
            <div class="touch-controls" aria-label="Touch controls">
              <button type="button" data-move="left" aria-label="Move left">&larr;</button>
              <button type="button" data-move="rotate" aria-label="Rotate">&uarr;</button>
              <button type="button" data-move="right" aria-label="Move right">&rarr;</button>
              <button type="button" data-move="down" aria-label="Move down">&darr;</button>
              <button type="button" data-move="drop" aria-label="Hard drop">Drop</button>
            </div>
          </div>
        </div>
      </section>

      <section class="status" aria-label="Deployment status">
        <div>
          <span class="label">Build</span>
          <strong>Static HTML</strong>
        </div>
        <div>
          <span class="label">Deploy</span>
          <strong>Cloudflare Pages</strong>
        </div>
        <div>
          <span class="label">Updated</span>
          <strong id="updated-date">Ready</strong>
        </div>
      </section>
    </main>
  </body>
</html>
